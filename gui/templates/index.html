<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Music Tagger</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎵</span>
      <div>
        <h1>Smart Music Tagger</h1>
        <p class="tagline">AI-powered metadata cleaning &amp; file renaming</p>
      </div>
    </div>
    <span class="badge" id="status-badge">Idle</span>
  </header>

  <main class="container">
    <!-- ───────────────── Configuration form ───────────────── -->
    <section class="card" id="config-card">
      <h2 class="card-title">Configuration</h2>
      <form id="run-form" autocomplete="off">
        <div class="grid">
          <label class="field">
            <span>Groq API Key</span>
            <input type="password" name="groq_api_key" id="groq_api_key"
                   placeholder="gsk_..." required />
          </label>

          <label class="field">
            <span>API URL</span>
            <input type="text" name="groq_api_url" id="groq_api_url"
                   value="{{ prefill.groq_api_url }}" required />
          </label>

          <label class="field">
            <span>Model</span>
            <input type="text" name="groq_model" id="groq_model"
                   value="{{ prefill.groq_model }}" required />
          </label>

          <label class="field">
            <span>Request Delay (seconds)</span>
            <input type="number" name="groq_request_delay_seconds"
                   id="groq_request_delay_seconds" min="0" step="0.5"
                   value="{{ prefill.groq_request_delay_seconds }}" />
          </label>

          <label class="field field-wide">
            <span>Music Directory</span>
            <input type="text" name="music_directory" id="music_directory"
                   value="{{ prefill.music_directory }}"
                   placeholder="C:/Users/You/Music" required />
          </label>
        </div>

        <div class="actions">
          <button type="submit" id="run-btn" class="btn btn-primary">
            ▶ Start Tagging
          </button>
        </div>
        <p class="hint">
          Your API key is sent only to start the job and is never stored,
          logged, or echoed back.
        </p>
      </form>
    </section>

    <!-- ───────────────── Progress panel ───────────────── -->
    <section class="card hidden" id="progress-card">
      <h2 class="card-title">Progress</h2>

      <div class="progress-meta">
        <div class="stat">
          <span class="stat-label">Files</span>
          <span class="stat-value" id="stat-files">0 / 0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Success</span>
          <span class="stat-value ok" id="stat-success">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Failed</span>
          <span class="stat-value err" id="stat-failed">0</span>
        </div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="results-head">
        <h3>Results</h3>
        <button type="button" class="btn btn-ghost hidden" id="run-again-btn">
          ↻ Run Again
        </button>
      </div>
      <ul class="result-list" id="result-list"></ul>
    </section>

    <!-- ───────────────── Error banner ───────────────── -->
    <div class="banner banner-error hidden" id="error-banner"></div>

    <!-- ───────────────── Summary ───────────────── -->
    <section class="card summary-card hidden" id="summary-card">
      <h2 class="card-title">Summary</h2>
      <div id="summary-body"></div>
    </section>
  </main>

  <footer class="footer">
    <span>Smart Music Tagger · same core engine as the CLI</span>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
